<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050722">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>أرفف الصيدلية</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<script>if(/Chrome\//.test(navigator.userAgent))document.documentElement.classList.add('lgx')</script>
<style>
/* ================= tokens ================= */
:root{
  --text:#fff; --dim:rgba(255,255,255,.82); --faint:rgba(255,255,255,.6);
  --accent:#8fdcff; --orange:#ff8a3d; --accent-soft:rgba(127,214,255,.16); --warn:#e8c26a;
  --out:cubic-bezier(.2,.9,.25,1);
  --spring:cubic-bezier(.34,1.45,.64,1);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  box-sizing:border-box; color-scheme:dark;
}
@supports (transition-timing-function:linear(0,1)){:root{--spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1)}}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#03040c}
body{min-height:100dvh;color:var(--text);overflow-x:hidden;
  font-family:'Readex Pro',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ================= الخلفية: أضواء بتتحرك ببطء (transform فقط = خفيفة) ================= */
.ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#03040c}
.orb{position:absolute;border-radius:50%;will-change:transform;animation:drift 22s ease-in-out infinite alternate}
.o1{width:80vmax;height:80vmax;left:-36vmax;top:8vh;--dx:26vmax;--dy:-14vh;
  background:radial-gradient(circle at 32% 30%,#3df0ff 0,#2f7bff 36%,#5a3cff 58%,#7a2bff 64%,rgba(122,43,255,0) 72%)}
.o2{width:70vmax;height:70vmax;right:-34vmax;top:-12vh;--dx:-22vmax;--dy:26vh;animation-duration:27s;animation-delay:-8s;
  background:radial-gradient(circle at 60% 40%,#ffc21a 0,#ff8a1f 40%,#ff4d1f 62%,rgba(255,77,31,0) 72%)}
.o3{width:64vmax;height:64vmax;right:-30vmax;bottom:-22vh;--dx:-30vmax;--dy:-26vh;animation-duration:31s;animation-delay:-14s;
  background:radial-gradient(circle at 50% 50%,#ff5a2a 0,#ff3d2e 45%,#d12a6a 62%,rgba(209,42,106,0) 72%)}
.o4{width:62vmax;height:62vmax;left:-24vmax;bottom:-26vh;--dx:24vmax;--dy:-22vh;animation-duration:35s;animation-delay:-20s;
  background:radial-gradient(circle at 40% 40%,#22d3ff 0,#2563ff 45%,#6d2bff 64%,rgba(109,43,255,0) 72%)}
@keyframes drift{to{transform:translate3d(var(--dx),var(--dy),0) scale(1.12)}}
body.lock .orb{animation-play-state:paused}

/* ================= Liquid Glass ================= */
.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.04) 45%,rgba(255,255,255,.09));
  -webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.15),inset 1.5px 1.5px 1px -1px rgba(255,255,255,.75),inset -1.5px -1.5px 1px -1px rgba(255,255,255,.32),
    inset 0 -14px 22px -14px rgba(255,255,255,.18),0 18px 40px -16px rgba(0,0,0,.55),0 4px 14px -6px rgba(0,0,0,.35)}
/* الألواح الكبيرة: بلور أخف عشان الأداء */
.frame.glass,.notes.glass{-webkit-backdrop-filter:blur(14px) saturate(1.7);backdrop-filter:blur(14px) saturate(1.7)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(40,52,120,.72)}}
/* حافة لامعة بتتبع اتجاه الإضاءة (--ang) */
.rim::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;opacity:.75;
  background:conic-gradient(from var(--ang,215deg),rgba(255,255,255,.95),rgba(255,255,255,.04) 24%,rgba(255,255,255,.5) 50%,rgba(255,255,255,.04) 76%,rgba(255,255,255,.95));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}

/* ================= الرئيسية ================= */
.app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:calc(var(--sat) + 72px) 18px calc(var(--sab) + 44px)}
.bar{position:fixed;z-index:5;top:0;inset-inline:0;display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--sat) + 10px) 16px 12px;pointer-events:none}
.bar>*{pointer-events:auto}
.bar-bg{position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .35s;pointer-events:none;
  background:linear-gradient(rgba(3,4,12,.7),rgba(3,4,12,0));-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
  -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.bar-title{font-weight:500;font-size:17px;opacity:0;transform:translateY(8px);transition:opacity .3s,transform .5s var(--spring)}
.scrolled .bar-bg{opacity:1}.scrolled .bar-title{opacity:1;transform:none}
.pill{display:flex;align-items:center;gap:2px;padding-inline:14px 6px;border-radius:99px;font-size:13px;color:var(--text)}
.cnt{font-variant-numeric:tabular-nums;font-weight:500;min-width:34px;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.track{position:relative;display:flex;align-items:center;height:40px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.track.grab{cursor:grabbing}
.track button{position:relative;z-index:1;flex:none;width:22px;height:40px;display:grid;place-items:center}
.track button::after{content:"";width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);transition:background .3s,transform .5s var(--spring),box-shadow .3s}
.track button.on::after{background:#fff;transform:scale(1.25)}
.track button.done::after{background:var(--accent);box-shadow:0 0 9px var(--accent)}
.lens{position:absolute;z-index:0;left:0;top:50%;width:38px;height:38px;margin-top:-19px;border-radius:50%;pointer-events:none;will-change:transform;
  background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.75),rgba(255,255,255,.14) 42%,rgba(255,255,255,.06) 62%,rgba(255,255,255,.24));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),inset 2px 3px 4px rgba(255,255,255,.6),inset -2px -4px 6px rgba(255,255,255,.25),0 0 18px rgba(143,220,255,.5),0 10px 18px -6px rgba(0,0,0,.55);transition:background .25s}
.track.grab .lens{background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.6),rgba(255,255,255,.04) 45%,rgba(255,255,255,.02) 65%,rgba(255,255,255,.2))}
.top h1,.top p,.meta small,.stamp,.notes span,.empty-frame span{text-shadow:0 1px 12px rgba(0,0,0,.45)}
.top h1{margin:0;font-size:36px;font-weight:500;letter-spacing:-.01em}
.top p{margin:6px 0 0;color:var(--dim);font-size:15px;font-weight:300}
.list{display:grid;gap:14px;margin-top:26px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}

.card{position:relative;display:block;width:100%;height:200px;text-align:start;overflow:hidden;isolation:isolate;border-radius:30px;
  background:linear-gradient(150deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 50%,rgba(255,255,255,.1));
  -webkit-backdrop-filter:blur(12px) saturate(1.7) brightness(1.05);backdrop-filter:blur(12px) saturate(1.7) brightness(1.05);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),inset 2px 2px 1px -1px rgba(255,255,255,.5),inset -2px -2px 1px -1px rgba(255,255,255,.2),0 20px 40px -18px rgba(0,0,0,.75);
  transition:transform .55s var(--spring)}
.card:active{transform:scale(.96);transition-duration:.12s}
.card::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),rgba(160,220,255,.22),transparent 65%)}
.card:has(.media img) .scrim{opacity:1}
.card .meta,.card .num{text-shadow:0 1px 14px rgba(0,0,0,.35)}
.card.lit::after{opacity:1}
@media (hover:hover){.card:hover::after{opacity:1}}
.card::before{z-index:4}
.card .media{position:absolute;inset:0;z-index:0}
.card .media img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
.card .media img.on{opacity:1}
.card:has(.media img){-webkit-backdrop-filter:none;backdrop-filter:none}
.card .scrim{opacity:0;position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(5,9,16,.9) 0%,rgba(5,9,16,.35) 55%,rgba(5,9,16,.08) 100%)}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:14px;padding-inline:0 26px}
.ph i{display:block;height:5px;border-radius:5px;background:linear-gradient(90deg,rgba(255,255,255,.3),transparent)}
.ph i:nth-child(1){width:52%}.ph i:nth-child(2){width:38%}.ph i:nth-child(3){width:46%}
.num{position:absolute;z-index:2;top:8px;inset-inline-start:22px;font-size:74px;font-weight:200;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff 20%,rgba(190,220,255,.3));-webkit-background-clip:text;background-clip:text;color:transparent}
.status{position:absolute;z-index:2;top:20px;inset-inline-end:20px;display:flex;align-items:center;gap:7px;font-size:12px;padding:6px 12px;border-radius:99px;
  background:rgba(8,14,24,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:var(--dim)}
.status b{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.ok{color:var(--text)}.status.ok b{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.status.part b{background:var(--warn)}
.meta{position:absolute;z-index:2;inset:auto 22px 18px 22px}
.meta p{margin:0 0 6px;font-size:15px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta p.empty{color:var(--faint)}
.meta small{color:var(--dim);font-size:12px;font-weight:300}
.enter{animation:enter .7s var(--out) both;animation-delay:calc(var(--i)*60ms)}
@keyframes enter{from{opacity:0;transform:translateY(22px) scale(.96)}}

/* ================= شاشة الرف ================= */
.detail{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;overflow:hidden;will-change:clip-path;background:#03040c}
.detail[hidden]{display:none}
.detail::before{content:"";position:absolute;inset:-20%;pointer-events:none;will-change:transform;animation:d2 30s ease-in-out infinite alternate;
  background:radial-gradient(40vmax 40vmax at 78% 12%,#ff9a1f,rgba(255,90,30,.5) 55%,transparent 72%),radial-gradient(46vmax 46vmax at 18% 38%,#2fd5ff,#3a5bff 50%,rgba(110,45,255,.6) 66%,transparent 76%),radial-gradient(44vmax 44vmax at 70% 90%,#ff4d2e,rgba(209,42,106,.5) 58%,transparent 74%)}
@keyframes d2{to{transform:translate3d(6%,-5%,0) scale(1.12)}}
.bgnum{position:absolute;inset-inline-end:-2vw;top:8vh;font-size:min(62vw,420px);font-weight:200;line-height:1;color:rgba(150,200,255,.055);pointer-events:none;user-select:none;font-variant-numeric:tabular-nums;will-change:transform}
.dhead{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 14px) 16px 8px}
.iconbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;transition:transform .5s var(--spring)}
.iconbtn:active{transform:scale(.86);transition-duration:.1s}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dhead h2{margin:0;font-size:22px;font-weight:500;flex:1}
.dots{padding:0 8px;border-radius:99px}
.pill .track{padding:0 2px}
.dscroll{position:relative;z-index:1;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 16px calc(var(--sab) + 40px)}
.dbody{max-width:1000px;margin:0 auto;display:grid;gap:16px}
.side{display:grid;gap:12px}
@media (min-width:900px){.dbody{grid-template-columns:1.2fr 1fr;align-items:start}.frame{aspect-ratio:4/3!important}}
.frame{margin:0;aspect-ratio:4/3.4;border-radius:32px;overflow:hidden;padding:8px}
.frame .inner{position:relative;width:100%;height:100%;border-radius:25px;overflow:hidden}
.frame img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.12);animation:fade .5s var(--out)}
@keyframes fade{from{opacity:0}}
.empty-frame{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1.5px dashed rgba(160,205,255,.25);border-radius:25px;color:var(--dim);transition:background .2s}
.empty-frame:active{background:var(--accent-soft)}
.empty-frame .plus{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:200;color:var(--accent);background:var(--accent-soft);box-shadow:0 0 34px rgba(127,214,255,.2);transition:transform .5s var(--spring)}
.empty-frame:active .plus{transform:scale(.88)}
.empty-frame strong{font-weight:500;color:var(--text);font-size:16px}.empty-frame span{font-size:14px}
.tools{position:absolute;top:20px;inset-inline-end:20px;display:flex;gap:8px}
.tools .iconbtn{width:42px;height:42px}.tools svg{width:18px;height:18px}
.notes{display:block;border-radius:28px;padding:16px 18px;transition:box-shadow .25s}
.notes:focus-within{box-shadow:inset 0 0 0 1px rgba(127,214,255,.6),inset 2px 2px 1px -1px rgba(255,255,255,.5),0 0 0 4px var(--accent-soft),0 12px 30px -12px rgba(0,0,0,.65)}
.notes span{display:block;font-size:13px;color:var(--dim);margin-bottom:8px}
.notes textarea{width:100%;min-height:220px;resize:none;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:17px;line-height:1.85}
.notes textarea::placeholder{color:var(--faint)}
.stamp{text-align:center;color:var(--faint);font-size:12px;font-weight:300;margin:0}
.toast{position:absolute;z-index:6;top:calc(var(--sat) + 16px);inset-inline:0;margin:auto;width:max-content;max-width:90%;display:flex;align-items:center;gap:14px;padding:10px 20px;border-radius:99px;font-size:14px;
  opacity:0;transform:translateY(-16px) scale(.9);pointer-events:none;transition:opacity .25s,transform .55s var(--spring)}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast.warn{box-shadow:inset 0 0 0 1px rgba(232,194,106,.6)}
.toast button{color:var(--accent);font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="ambient"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div></div>

<header class="bar">
  <div class="bar-bg"></div>
  <span class="bar-title">أرفف الصيدلية</span>
  <div class="pill glass rim" id="progress"><span class="cnt" id="cnt" dir="ltr"></span><div class="track" id="ptrack"></div></div>
</header>

<main class="app">
  <header class="top">
    <h1>أرفف الصيدلية</h1>
    <p>نظرة سريعة على محتويات المكان</p>
  </header>
  <section class="list" id="list" aria-label="الأرفف"></section>
</main>

<section class="detail" id="detail" hidden role="dialog" aria-modal="true">
  <div class="bgnum" id="bgnum" aria-hidden="true"></div>
  <div class="toast glass rim" id="toast" role="status"></div>
  <div class="dhead">
    <button class="iconbtn glass rim" id="back" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <h2 id="dtitle"></h2>
    <div class="track dots glass rim" id="dots"></div>
  </div>
  <div class="dscroll" id="dscroll"><div class="dbody" id="dbody"></div></div>
  <input type="file" id="file" accept="image/*" hidden>
</section>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/store.js"></script>
<script src="js/scrub.js"></script>
<script src="js/card.js"></script>
<script src="js/detail.js"></script>
<script src="js/main.js"></script>
</body>
</html>
